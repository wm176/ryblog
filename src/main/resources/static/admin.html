<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>文章管理</title>
    <link rel="stylesheet" href="1.css">
    <style>
        .admin-box {
            max-width: 900px;
            margin: 40px auto;
            background: #fbfbfb;
            padding: 20px 30px;
            border: 1px solid #eee;
        }

        .admin-box h2 {
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #eaeaea;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #fafafa;
        }

        .actions a {
            margin-right: 12px;
            color: #dc4d52;
            cursor: pointer;
            text-decoration: none;
        }

        .actions a:hover {
            text-decoration: underline;
        }

        .back-home {
            margin-bottom: 20px;
            display: inline-block;
            color: #555;
            text-decoration: none;
        }
        .btn-logout {
            padding: 6px 12px;
            
            font-size: 14px;
            cursor: pointer;
            border-radius: 0;
        }
        
    </style>
</head>

<body>

<div class="admin-box">
    <a class="back-home" href="/">← 返回首页</a>
    <button class="btn-logout" onclick="logout()">注销</button>
    <h2>文章管理</h2>

    <table>
        <thead>
        <tr>
            <th style="width: 50%">标题</th>
            <th style="width: 30%">创建时间</th>
            <th style="width: 20%">操作</th>
        </tr>
        </thead>
        <tbody id="article-table"></tbody>
    </table>
</div>

<script>
    // 拉取文章列表
    function loadArticles() {
        fetch("/article/list")
            .then(res => res.json())
            .then(res => {
                const tbody = document.getElementById("article-table");
                tbody.innerHTML = "";

                res.data.forEach(article => {
                    const tr = document.createElement("tr");

                    tr.innerHTML = `
                        <td>${article.title}</td>
                        <td>${new Date(article.createTime).toLocaleString()}</td>
                        <td class="actions">
                            <a href="detail.html?id=${article.id}">查看</a>
                            <a href="edit.html?id=${article.id}">编辑</a>
                            <a onclick="deleteArticle(${article.id})">删除</a>
                        </td>
                    `;

                    tbody.appendChild(tr);
                });
            });
    }

    // 删除文章（直接调你的接口）
    function deleteArticle(id) {
        if (!confirm("确定要删除这篇文章吗？")) return;

        fetch(`article/delete/${id}`, {
            method: "DELETE",
            headers: {
                Authorization: localStorage.getItem("token")
            }
        })
        .then(res => res.json())
        .then(() => {
            alert("删除成功");
            loadArticles(); // 刷新列表
        })
        .catch(() => {
            alert("删除失败");
        });
    }
    // 注销
    function logout() {
        localStorage.removeItem("token");
        location.href = "login.html";
    }

    // 页面加载即拉数据
    loadArticles();
</script>

</body>
</html>
